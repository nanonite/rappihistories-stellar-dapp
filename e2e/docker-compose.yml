# Web-owned Verdaccio cache for controlled npm installs.
#
# Default mode is locked: components/web/verdaccio-config.yaml has no npmjs
# uplink. To approve a new package temporarily, run
# components/web/unlock-npmjs.sh. Re-lock with components/web/lock-npmjs.sh
# after the package has been cached.

x-npm-cache-only: &npm-cache-only
  environment:
    NPM_CONFIG_REGISTRY: http://verdaccio:4873/
    npm_config_registry: http://verdaccio:4873/
    YARN_NPM_REGISTRY_SERVER: http://verdaccio:4873/
  networks:
    - npm-cache-only
  depends_on:
    verdaccio:
      condition: service_healthy
  extra_hosts:
    - "registry.npmjs.org=0.0.0.0"
    - "registry.npmjs.org=::"

services:
  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: medichain-e2e-verdaccio
    volumes:
      - ${VERDACCIO_CONFIG:-../components/web/verdaccio-config.yaml}:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
    ports:
      - "127.0.0.1:${E2E_VERDACCIO_PORT:-4874}:4873"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4873/-/ping').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - npm-cache-only
      - package-uplink
    restart: unless-stopped

  web:
    build:
      context: ../components
      dockerfile: web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-web-dev-template:latest}
        NPM_CONFIG_REGISTRY: http://127.0.0.1:${E2E_VERDACCIO_PORT:-4874}/
      network: host
      extra_hosts:
        - "registry.npmjs.org=0.0.0.0"
        - "registry.npmjs.org=::"
    image: medichain-web:latest
    container_name: medichain-web
    environment:
      NPM_CONFIG_REGISTRY: http://verdaccio:4873/
      npm_config_registry: http://verdaccio:4873/
      NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK:-testnet}
      NEXT_PUBLIC_STELLAR_MAINNET_RPC_URL: ${NEXT_PUBLIC_STELLAR_MAINNET_RPC_URL:-}
    extra_hosts:
      - "registry.npmjs.org=0.0.0.0"
      - "registry.npmjs.org=::"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    networks:
      - app-runtime
      - npm-cache-only
    depends_on:
      verdaccio:
        condition: service_healthy

  api-indexer:
    build:
      context: ..
      dockerfile: components/api-indexer/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:22-bookworm}
        NPM_CONFIG_REGISTRY: http://127.0.0.1:${E2E_VERDACCIO_PORT:-4874}/
      network: host
      extra_hosts:
        - "registry.npmjs.org=0.0.0.0"
        - "registry.npmjs.org=::"
    image: medichain-api-indexer:latest
    container_name: medichain-api-indexer
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NPM_CONFIG_REGISTRY: http://verdaccio:4873/
      npm_config_registry: http://verdaccio:4873/
      DATABASE_URL: postgres://medichain:medichain@postgres:5432/medichain
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      INDEXER_CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      EVENT_POLL_INTERVAL_MS: ${EVENT_POLL_INTERVAL_MS:-1000}
      API_INDEXER_PORT: 8788
    extra_hosts:
      - "registry.npmjs.org=0.0.0.0"
      - "registry.npmjs.org=::"
    ports:
      - "127.0.0.1:${API_INDEXER_PORT:-8788}:8788"
    volumes:
      - contract-shared:/shared:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8788/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app-runtime
      - npm-cache-only
    depends_on:
      postgres:
        condition: service_healthy
      stellar-local:
        condition: service_started
      contract-runner:
        condition: service_completed_successfully

  kms-gate:
    build:
      context: ..
      dockerfile: components/kms-gate/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:22-bookworm}
        NPM_CONFIG_REGISTRY: http://127.0.0.1:${E2E_VERDACCIO_PORT:-4874}/
      network: host
      extra_hosts:
        - "registry.npmjs.org=0.0.0.0"
        - "registry.npmjs.org=::"
    image: medichain-kms-gate:latest
    container_name: medichain-kms-gate
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NPM_CONFIG_REGISTRY: http://verdaccio:4873/
      npm_config_registry: http://verdaccio:4873/
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      KMS_CONTRACT_IDS_FILE: /shared/contract-ids.json
      API_INDEXER_URL: http://api-indexer:8788
    extra_hosts:
      - "registry.npmjs.org=0.0.0.0"
      - "registry.npmjs.org=::"
    ports:
      - "127.0.0.1:${KMS_GATE_PORT:-8790}:8790"
    volumes:
      - contract-shared:/shared:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8790/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app-runtime
      - npm-cache-only
    depends_on:
      stellar-local:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: medichain-postgres
    environment:
      POSTGRES_DB: medichain
      POSTGRES_USER: medichain
      POSTGRES_PASSWORD: medichain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medichain -d medichain"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-runtime

  minio:
    image: minio/minio:latest
    container_name: medichain-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: medichain
      MINIO_ROOT_PASSWORD: medichain
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-runtime

  stellar-local:
    image: stellar/quickstart:testing
    container_name: medichain-stellar-local
    command: ["--local", "--enable-soroban-rpc"]
    ports:
      - "127.0.0.1:${STELLAR_RPC_PORT:-8000}:8000"
    networks:
      - app-runtime

  contract-runner:
    build:
      context: ..
      dockerfile: components/contracts/Dockerfile
      target: contract-runner
    image: medichain-contract-runner:latest
    container_name: medichain-contract-runner
    environment:
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
    volumes:
      - contract-shared:/shared
    networks:
      - app-runtime
    depends_on:
      stellar-local:
        condition: service_started

  tier3-contract-flow:
    image: medichain-contract-runner:latest
    profiles: ["test"]
    entrypoint: ["bash", "/workspace/scripts/e2e-tier3-contract-flow.sh"]
    environment:
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      TIER3_SCENARIOS_FILE: /shared/tier3-scenarios.json
    volumes:
      - ..:/workspace:ro
      - contract-shared:/shared
    networks:
      - app-runtime
    depends_on:
      api-indexer:
        condition: service_healthy

  breakglass-contract-flow:
    image: medichain-contract-runner:latest
    profiles: ["test"]
    entrypoint: ["bash", "/workspace/scripts/e2e-breakglass-contract-flow.sh"]
    environment:
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      BREAKGLASS_SCENARIOS_FILE: /shared/breakglass-scenarios.json
    volumes:
      - ..:/workspace:ro
      - contract-shared:/shared
    networks:
      - app-runtime
    depends_on:
      api-indexer:
        condition: service_healthy
      tier3-contract-flow:
        condition: service_completed_successfully

  prescription-contract-flow:
    image: medichain-contract-runner:latest
    profiles: ["test"]
    entrypoint: ["bash", "/workspace/scripts/e2e-prescription-contract-flow.sh"]
    environment:
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      PRESCRIPTION_SCENARIOS_FILE: /shared/prescription-scenarios.json
    volumes:
      - ..:/workspace:ro
      - contract-shared:/shared
    networks:
      - app-runtime
    depends_on:
      api-indexer:
        condition: service_healthy
      breakglass-contract-flow:
        condition: service_completed_successfully

  kms-conformance-contract-flow:
    image: medichain-contract-runner:latest
    profiles: ["test"]
    entrypoint: ["bash", "/workspace/scripts/e2e-kms-conformance-contract-flow.sh"]
    environment:
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      KMS_CONFORMANCE_SCENARIOS_FILE: /shared/kms-conformance-scenarios.json
    volumes:
      - ..:/workspace:ro
      - contract-shared:/shared
    networks:
      - app-runtime
    depends_on:
      api-indexer:
        condition: service_healthy
      prescription-contract-flow:
        condition: service_completed_successfully

  e2e-runner:
    image: docker.io/library/node:22-bookworm
    profiles: ["test"]
    working_dir: /workspace/e2e
    command: ["sh", "-lc", "node --test tests/*.test.ts"]
    environment:
      API_INDEXER_URL: http://api-indexer:8788
      KMS_GATE_URL: http://kms-gate:8790
      STELLAR_RPC_URL: http://stellar-local:8000/soroban/rpc
      CONTRACT_IDS_FILE: /shared/contract-ids.json
      SEED_IDENTITIES_FILE: /shared/seed-identities.json
      TIER3_SCENARIOS_FILE: /shared/tier3-scenarios.json
      BREAKGLASS_SCENARIOS_FILE: /shared/breakglass-scenarios.json
      PRESCRIPTION_SCENARIOS_FILE: /shared/prescription-scenarios.json
      KMS_CONFORMANCE_SCENARIOS_FILE: /shared/kms-conformance-scenarios.json
    volumes:
      - .:/workspace/e2e:ro
      - contract-shared:/shared:ro
    networks:
      - app-runtime
    depends_on:
      api-indexer:
        condition: service_healthy
      kms-gate:
        condition: service_healthy
      tier3-contract-flow:
        condition: service_completed_successfully
      breakglass-contract-flow:
        condition: service_completed_successfully
      prescription-contract-flow:
        condition: service_completed_successfully
      kms-conformance-contract-flow:
        condition: service_completed_successfully
      stellar-local:
        condition: service_started

  # Template for future dApp containers that need to run pnpm/npm/yarn.
  # Keep package-installing app containers on npm-cache-only so they can reach
  # Verdaccio but cannot reach registry.npmjs.org or the wider web directly.
  #
  # Example:
  # dapp:
  #   <<: *npm-cache-only
  #   build:
  #     context: .
  #   command: pnpm install --frozen-lockfile

networks:
  npm-cache-only:
    name: medichain-e2e-npm-cache-only
    internal: true
  package-uplink:
    name: medichain-e2e-package-uplink
  app-runtime:
    name: medichain-e2e-app-runtime
volumes:
  verdaccio-storage:
  postgres-data:
  minio-data:
  contract-shared:
