name: CI

on: push

# Current monorepo CI is web/Node focused. Keep future component toolchains in
# component-owned job containers; see docs/integration-workspace.md.
env:
  NPM_CONFIG_REGISTRY: http://medichain-verdaccio:4873/
  npm_config_registry: http://medichain-verdaccio:4873/
  YARN_NPM_REGISTRY_SERVER: http://medichain-verdaccio:4873/

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.ref }}"
          git checkout --detach "${{ github.sha }}"

      - name: Configure pnpm registry
        run: |
          node -e 'const registry = process.env.NPM_CONFIG_REGISTRY.replace(/\/$/, ""); fetch(registry + "/-/ping").then((r)=>process.exit(r.ok?0:1)).catch((err)=>{ console.error(err); process.exit(1); })'
          npm install --global pnpm@9.15.9 --registry "${NPM_CONFIG_REGISTRY}" --loglevel warn
          test "$(pnpm config get registry)" = "${NPM_CONFIG_REGISTRY}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  contract-toolchain:
    runs-on: nix
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        run: |
          nix shell nixpkgs#git --command sh -c '
            git init .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            git fetch --depth 1 origin "${{ github.ref }}"
            git checkout --detach "${{ github.sha }}"
          '

      - name: Validate Nix flake
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Inspect contract toolchain
        run: nix develop .#ci --command cargo --version

      - name: Run native contract tests
        run: nix develop .#ci --command bash -lc 'cd components/contracts && cargo test'

      - name: Build contract WASM
        run: nix develop .#ci --command bash -lc 'cd components/contracts && cargo build --release --target wasm32-unknown-unknown'
